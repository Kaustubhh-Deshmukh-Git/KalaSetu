services:
  # 1. KalaSetu Express Backend Gateway
  - type: web
    name: kalasetu-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: kalasetu_jwt_secret_development_key_change_in_production_2026
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: OTP_RATE_LIMIT_MAX
        value: "5"
      - key: OTP_RATE_LIMIT_WINDOW_MINUTES
        value: "10"
      - key: CREDENTIAL_ENCRYPTION_KEY
        value: kalasetu_credential_key_32bytes_dev_only!
      - key: CORS_ORIGIN
        value: "*"

  # 2. KalaSetu Pricing Microservice
  - type: web
    name: kalasetu-pricing-service
    runtime: python
    rootDir: pricing-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGIN
        value: "*"
