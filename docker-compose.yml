version: '3.8'

services:
  # 1. Express Backend Gateway
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kalasetu-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-}
      - REDIS_URL=${REDIS_URL:-}
      - JWT_SECRET=${JWT_SECRET:-kalasetu_jwt_secret_production_key_2026}
      - PRICING_SERVICE_URL=http://pricing-service:8000
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GOOGLE_SPEECH_API_KEY=${GOOGLE_SPEECH_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - pricing-service

  # 2. FastAPI Dynamic Pricing Microservice
  pricing-service:
    build:
      context: ./pricing-service
      dockerfile: Dockerfile
    container_name: kalasetu-pricing-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
